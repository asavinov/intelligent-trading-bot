[build-system]
requires = ["setuptools >= 80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-trading-bot"
version = "0.8.dev"
description = "Intelligent Trading Bot: Automatically generating signals and trading based on machine learning and feature engineering"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Alexandr Savinov", email = "savinov@conceptoriented.org"}
]
keywords = ["machine-learning", "crypto", "bitcoin", "trading", "artificial-intelligence", "cryptocurrency", "feature-engineering", "algorithmic-trading", "crypto-trading", "trading-bots"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]

dependencies = [
    "apscheduler",
    "click",
    "tqdm",

    "numpy==2.*",
    "pandas==3.*",
    "pyarrow==25.*",

    "python-binance",

    "numba",
    "fin-primitives>=3.2",

    "scikit-learn",
    "lightgbm",
    "tensorflow",
    "keras",
]

[project.optional-dependencies]
talib = [
    "ta-lib",  # Native TA-Lib library (all TA functions). Without it, fin-primitives computes the common ones
]

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "pytest >= 9.0",
    #"ruff >= 0.6",
    #"mypy >= 1.8",
]

[project.scripts]
itb-download = "itb.scripts.download:main"
itb-merge = "itb.scripts.merge:main"
itb-features = "itb.scripts.features:main"
itb-labels = "itb.scripts.labels:main"
itb-train = "itb.scripts.train:main"
itb-predict = "itb.scripts.predict:main"
itb-predict_rolling = "itb.scripts.predict:main"
itb-signals = "itb.scripts.signals:main"
itb-output = "itb.scripts.output:main"
itb-simulate = "itb.scripts.simulate:main"

[project.urls]
Homepage = "https://github.com/asavinov/intelligent-trading-bot"
Repository = "https://github.com/asavinov/intelligent-trading-bot"
Documentation = "https://asavinov.github.io/intelligent-trading-bot"
"Bug Tracker" = "https://github.com/asavinov/intelligent-trading-bot/issues"

#[tool.setuptools]
#packages = ["common", "inputs", "outputs", "scripts", "service"]
#include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["itb*"]
#exclude = ["tests", "tests.*"]

# Optional: dynamic version from __version__ or git tag (needs setuptools-scm)
# [tool.setuptools.dynamic]
# version = {attr = "my_awesome_package.__version__"}
